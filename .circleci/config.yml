version: 2.1

aliases:

  - defaults: &defaults
      docker:
        - image: cimg/node:10.24.1-browsers
      working_directory: ~/code
      environment:
        # JOBS: 1 required to disable workers pools on broccoli as the underlying container reports many cores and runs out of memory if trying to spawn that many threads!
        JOBS: 1
  - &restore-repo-cache
      key: v1-goodcity-lib-repo-{{ .Environment.CIRCLE_SHA1 }}
  - &restore-yarn-cache
      keys:
        - v1-goodcity-lib-yarn-packages-{{ checksum "yarn.lock" }}
  - &save-yarn-cache
      key: v1-goodcity-lib-yarn-packages-{{ checksum "yarn.lock" }}
      paths:
        - node_modules
        - ~/.cache/yarn
  - &yarn
    |
      yarn install --non-interactive --cache-folder ~/.cache/yarn --frozen-lockfile
  - &restore-bower-cache
      key: v1-goodcity-lib-bower-components-{{ checksum "bower.json" }}
  - &save-bower-cache
      key: v1-goodcity-lib-bower-components-{{ checksum "bower.json" }}
      paths:
        - bower_components

# -----------------------------
# Orbs
# -----------------------------

orbs:
  browser-tools: circleci/browser-tools@1.5.2

jobs:
  checkout_code:
    <<: *defaults
    steps:
      - checkout
      - save_cache:
          key: v1-goodcity-lib-repo-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/code

  package_dependencies:
    <<: *defaults
    steps:
      - restore_cache: *restore-repo-cache
      - restore_cache: *restore-yarn-cache
      - run: *yarn
      - save_cache: *save-yarn-cache
      - restore_cache: *restore-bower-cache
      - run: yarn run bower install
      - save_cache: *save-bower-cache

  test_cases:
    <<: *defaults
    steps:
      - run: sudo apt update && sudo apt -y upgrade libu2f-udev
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - restore_cache: *restore-repo-cache
      - restore_cache: *restore-yarn-cache
      - restore_cache: *restore-bower-cache
      - run:
          name: Start Ember test server
          command: yarn run ember server --port 4203
          background: true
      - run:
          name: Wait for Ember test server to start
          command: dockerize -wait tcp://localhost:4203 -timeout 1m
      - run:
          name: Run Ember tests
          command: COVERAGE=true yarn run ember test
      - persist_to_workspace:
          root: .
          paths:
            - coverage*/lcov.info

  upload-coverage:
    <<: *defaults
    steps:
      - restore_cache: *restore-repo-cache
      - restore_cache: *restore-yarn-cache
      - restore_cache: *restore-bower-cache
      - attach_workspace:
          at: ~/code
      - run:
          name: Upload coverage results to Code Climate
          command: |
            yarn run codeclimate-test-reporter < coverage*/lcov.info

workflows:
    build_and_bundle:
      jobs:
        - checkout_code
        - package_dependencies:
            requires:
              - checkout_code
        - test_cases:
            requires:
              - package_dependencies
        - upload-coverage:
            requires:
              - package_dependencies
              - test_cases
            filters:
              branches:
                only: /^(master|live)$/
